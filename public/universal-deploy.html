<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Optimizer Pro | Universal Deploy</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F2EFED; color: #000000; transition: all 0.5s ease; }
        .font-serif { font-family: 'Instrument Serif', serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-spin { animation: spin 1s linear infinite; }
        .fixed-header { position: sticky; top: 0; z-index: 50; backdrop-filter: blur(12px); background: rgba(242, 239, 237, 0.9); }
    </style>
</head>
<body class="selection:bg-black selection:text-[#F2EFED]">
    <div id="root"></div>

    <!-- Icons Library -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- React & Libraries CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { motion, AnimatePresence } = FramerMotion;

        // --- Mock Analysis Engine (Zero-Cost Local Logic) ---
        const localScoringEngine = (text) => {
            const keywords = ['react', 'next.js', 'typescript', 'architecture', 'strategy', 'leadership', 'scaling', 'performance', 'cloud'];
            const foundSteps = keywords.filter(k => text.toLowerCase().includes(k));
            const missing = keywords.filter(k => !text.toLowerCase().includes(k));
            const score = 45 + (foundSteps.length * 5);
            
            return {
                score: Math.min(score, 98),
                matched: foundSteps,
                missing: missing,
                wordCount: text.split(' ').length,
                readability: score > 80 ? "Executive" : "Standard"
            };
        };

        // --- Components ---
        const App = () => {
            const [view, setView] = useState('landing');
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [url, setUrl] = useState('');
            const [textData, setTextData] = useState('');
            const [analysis, setAnalysis] = useState(null);

            const startAnalysis = () => {
                setIsAnalyzing(true);
                setTimeout(() => {
                    const res = localScoringEngine(textData || url);
                    setAnalysis({
                        ...res,
                        ai: {
                            original_summary: textData.substring(0, 150) + "...",
                            optimized_summary: "Results-driven Professional with a focus on high-scale architecture and modern ecosystems. Proven track record of delivering specialized technical leadership...",
                            headlines: ["Principal Systems Architect | Next.js & AI Expert", "Technical Leader | Strategic Product Engineering"],
                            tone_audit: { 
                                description: "The profile exhibits strong technical alignment but lacks quantifiable impact metrics in the high-priority sections.",
                                bs: "12%"
                            }
                        }
                    });
                    setIsAnalyzing(false);
                    setView('dashboard');
                }, 2500);
            };

            return (
                <div className="min-h-screen">
                    <AnimatePresence mode="wait">
                        {view === 'landing' && (
                            <motion.main key="landing" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="container mx-auto px-6 py-32 text-center flex flex-col items-center justify-center min-h-screen">
                                <span className="uppercase tracking-[0.4em] text-[10px] mb-8 font-bold">Universal Deploy v1.0</span>
                                <h1 className="font-serif text-[6rem] md:text-[8.5rem] leading-[0.9] mb-12 tracking-tighter">
                                    Absolute <br /> <span className="italic">Simplicity.</span>
                                </h1>
                                <p className="text-xl md:text-2xl opacity-70 mb-16 max-w-2xl mx-auto leading-relaxed">
                                    Drag, drop, and deploy. Our standalone optimizer provides executive-level profile auditing in a single, portable unit.
                                </p>
                                <button onClick={() => setView('analyze')} className="bg-black text-[#F2EFED] px-12 py-5 uppercase tracking-widest text-[11px] font-bold hover:bg-[#222] transition-all">
                                    Initialize Sequence
                                </button>
                            </motion.main>
                        )}

                        {view === 'analyze' && (
                            <motion.main key="analyze" initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0 }} className="container mx-auto px-6 py-32 max-w-4xl text-center">
                                <h2 className="font-serif text-7xl mb-24">Context Audit.</h2>
                                <div className="space-y-16 text-left max-w-2xl mx-auto">
                                    <div className="space-y-4">
                                        <label className="uppercase tracking-[0.3em] text-[10px] font-bold opacity-50">Profile Text / URL Source</label>
                                        <textarea 
                                            value={textData} onChange={(e) => setTextData(e.target.value)}
                                            placeholder="Paste Profile text or URL..."
                                            className="w-full bg-transparent border-b border-black/10 focus:border-black outline-none font-serif text-2xl py-4 transition-all h-32"
                                        />
                                    </div>
                                    <div className="flex justify-center flex-col items-center gap-8">
                                        <button onClick={startAnalysis} className="bg-black text-[#F2EFED] px-12 py-5 uppercase tracking-widest text-[11px] font-bold">Deep Scan</button>
                                        <button onClick={() => setView('landing')} className="uppercase tracking-widest text-[10px] opacity-40 hover:opacity-100">Back</button>
                                    </div>
                                </div>
                                {isAnalyzing && (
                                    <div className="fixed inset-0 bg-[#F2EFED] z-[100] flex items-center justify-center">
                                        <div className="flex flex-col items-center gap-8">
                                            <div className="w-8 h-8 border-t-2 border-black rounded-full animate-spin"></div>
                                            <p className="font-serif text-2xl">Reconstructing Matrix...</p>
                                        </div>
                                    </div>
                                )}
                            </motion.main>
                        )}

                        {view === 'dashboard' && analysis && (
                            <motion.main key="dashboard" initial={{ opacity: 0 }} animate={{ opacity: 1 }} className="p-6 md:p-16 max-w-[1200px] mx-auto space-y-32">
                                <header className="flex justify-between items-end border-b border-black/10 pb-12">
                                    <h1 className="text-4xl font-serif">Analysis Results.</h1>
                                    <button onClick={() => setView('analyze')} className="uppercase tracking-widest text-[10px] font-bold border-b border-black">New Scan</button>
                                </header>
                                
                                <section className="grid grid-cols-1 md:grid-cols-3 gap-16">
                                    <div className="space-y-4">
                                        <h3 className="text-8xl font-serif">{analysis.score}</h3>
                                        <p className="uppercase tracking-[0.3em] text-[10px] opacity-50">ATS Probability</p>
                                    </div>
                                    <div className="space-y-4">
                                        <h3 className="text-8xl font-serif">{analysis.wordCount}</h3>
                                        <p className="uppercase tracking-[0.3em] text-[10px] opacity-50">Token Count</p>
                                    </div>
                                    <div className="space-y-4">
                                        <h3 className="text-8xl font-serif">{analysis.readability}</h3>
                                        <p className="uppercase tracking-[0.3em] text-[10px] opacity-50">Clarity Grade</p>
                                    </div>
                                </section>

                                <section className="grid lg:grid-cols-2 gap-32">
                                    <div className="space-y-12">
                                        <span className="uppercase tracking-[0.4em] text-[11px] font-bold">AI Engineered Summary</span>
                                        <p className="text-xl leading-loose font-serif italic">"{analysis.ai.optimized_summary}"</p>
                                    </div>
                                    <div className="space-y-12">
                                        <span className="uppercase tracking-[0.4em] text-[11px] font-bold">Verified Skills Identified</span>
                                        <div className="flex flex-wrap gap-4">
                                            {analysis.matched.map(s => <span key={s} className="px-5 py-2 border border-black/10 uppercase tracking-widest text-[10px]">{s}</span>)}
                                            {analysis.missing.map(s => <span key={s} className="px-5 py-2 border border-red-500/20 text-red-700/50 uppercase tracking-widest text-[10px] line-through">{s}</span>)}
                                        </div>
                                    </div>
                                </section>

                                <section className="pt-24 border-t border-black/10">
                                    <span className="uppercase tracking-[0.4em] text-[11px] font-bold block mb-12">High-Impact Headlines</span>
                                    <div className="space-y-8">
                                        {analysis.ai.headlines.map(h => <p key={h} className="text-4xl md:text-6xl font-serif border-b border-black/5 pb-8 hover:italic cursor-crosshair transition-all">{h}</p>)}
                                    </div>
                                </section>

                                <footer className="pt-32 opacity-20 text-center pb-12">
                                    <p className="uppercase tracking-[0.6em] text-[8px]">LinkedIn Optimizer Standalone | Local Pulse Engine</p>
                                </footer>
                            </motion.main>
                        )}
                    </AnimatePresence>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Optimizer Pro | Standalone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F2EFED; color: #000; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
        .font-serif { font-family: 'Instrument Serif', serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .loading-bar { height: 2px; background: #000; width: 0%; transition: width 0.5s ease; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-spin-fast { animation: spin 0.8s linear infinite; }
    </style>
</head>
<body class="selection:bg-[#1A1A1A] selection:text-[#F2EFED]">
    <div id="app"></div>

    <script>
        // --- State ---
        let view = 'landing';
        let isAnalyzing = false;
        let currentStep = 0;
        const steps = ["Establishing connection...", "Parsing contextual data...", "Deep text extraction...", "AI structural contrast...", "Finalizing report format"];

        // --- Components ---
        function renderLanding() {
            return `
                <main class="container mx-auto px-6 h-screen flex flex-col items-center justify-center text-center opacity-0 transition-opacity duration-1000" id="landing-main">
                    <p class="text-[11px] tracking-[0.3em] uppercase text-[#1A1A1A] font-medium mb-12">System Level Analysis</p>
                    <h1 class="font-serif text-6xl md:text-[8rem] font-medium tracking-tight leading-[0.9] mb-12">Absolute <br /><span class="italic">precision.</span></h1>
                    <p class="text-xl md:text-2xl text-[#333333] mb-16 max-w-3xl mx-auto leading-relaxed">Input your LinkedIn URL for a structural and psychological audit. We bypass trivial advice for executive-level engineered results.</p>
                    <button onclick="setView('analyze')" class="bg-[#1A1A1A] text-[#F2EFED] px-12 py-5 rounded-sm hover:bg-[#000000] transition-all flex items-center gap-6 mx-auto group">
                        <span class="text-[11px] tracking-[0.2em] uppercase">Initiate Sequence</span>
                        <svg class="w-5 h-5 transition-transform group-hover:translate-x-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    </button>
                </main>
            `;
        }

        function renderAnalyze() {
            return `
                <main class="container mx-auto px-6 pt-32 max-w-4xl text-center pb-32">
                    <p class="text-[11px] tracking-[0.4em] uppercase text-[#1A1A1A] font-medium mb-8">System Entry</p>
                    <h2 class="font-serif text-6xl md:text-8xl font-medium tracking-tight mb-24">Context Audit.</h2>
                    <div class="max-w-2xl mx-auto text-left space-y-20">
                        <div class="space-y-6">
                            <label class="text-[11px] uppercase tracking-[0.4em] font-bold">Profile Descriptor (URL)</label>
                            <input id="profile-url" placeholder="https://linkedin.com/in/..." class="w-full bg-transparent border-b border-[#1A1A1A]/20 focus:border-[#000000] pb-6 text-2xl font-serif outline-none transition-colors" />
                        </div>
                        <div class="pt-8 flex justify-center flex-col items-center gap-12">
                            <button onclick="startAnalysis()" class="bg-[#1A1A1A] text-[#F2EFED] px-10 py-5 rounded-sm hover:bg-[#000000] transition-colors flex items-center gap-4 group">
                                <span class="text-[11px] tracking-widest uppercase font-bold">Deep Scan</span>
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                            </button>
                            <button onclick="setView('landing')" class="text-[10px] tracking-widest uppercase text-[#666666] hover:text-[#000000]">Return to Surface</button>
                        </div>
                    </div>
                </main>
                <div id="loader-overlay" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-[#F2EFED] p-6">
                    <div class="w-full max-w-2xl bg-white p-12 md:p-20 rounded-sm shadow-2xl space-y-12">
                        <div class="flex items-center gap-6 pb-8 border-b border-[#1A1A1A]/10">
                            <div class="w-6 h-6 border-2 border-black border-t-transparent rounded-full animate-spin-fast"></div>
                            <h3 class="text-2xl font-serif">Processing Matrix</h3>
                        </div>
                        <div id="steps-container" class="space-y-6 text-left"></div>
                    </div>
                </div>
            `;
        }

        function renderDashboard() {
            // Static mock data for demo since repo is "static" host
            return `
                <main class="p-6 md:p-16 max-w-[1400px] mx-auto space-y-32">
                    <header class="flex justify-between items-center border-b border-[#1A1A1A]/10 pb-16">
                        <div class="flex items-center gap-8">
                            <button onclick="setView('analyze')" class="p-3 hover:bg-[#1A1A1A]/5 rounded-full border border-black/10">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l-7-7m7-7"></path></svg>
                            </button>
                            <h1 class="text-4xl font-serif">Deep Analysis Set</h1>
                        </div>
                        <div class="flex gap-8 text-[11px] tracking-widest uppercase font-bold">
                            <button onclick="setView('analyze')" class="text-[#666666]">New Audit</button>
                            <button class="border-b border-[#000000]">Export</button>
                        </div>
                    </header>
                    <section class="grid grid-cols-2 lg:grid-cols-4 gap-16 items-end">
                        <div class="flex flex-col items-center"><div class="text-7xl font-serif">84</div><p class="text-[10px] uppercase tracking-widest opacity-40 mt-4">ATS Score</p></div>
                        <div class="space-y-2"><span class="text-8xl font-serif">12</span><p class="text-[10px] tracking-widest uppercase text-[#666666] pt-4 border-t border-[#1A1A1A]/10">Action Verbs</p></div>
                        <div class="space-y-2"><span class="text-6xl font-serif">High</span><p class="text-[10px] tracking-widest uppercase text-[#666666] pt-4 border-t border-[#1A1A1A]/10">Readability</p></div>
                        <div class="space-y-2"><span class="text-8xl font-serif">412</span><p class="text-[10px] tracking-widest uppercase text-[#666666] pt-4 border-t border-[#1A1A1A]/10">Word Count</p></div>
                    </section>
                </main>
            `;
        }

        // --- Core Functions ---
        function setView(newView) {
            view = newView;
            const app = document.getElementById('app');
            if (view === 'landing') app.innerHTML = renderLanding();
            if (view === 'analyze') app.innerHTML = renderAnalyze();
            if (view === 'dashboard') app.innerHTML = renderDashboard();
            
            setTimeout(() => {
                const main = document.querySelector('main');
                if (main) main.classList.remove('opacity-0');
            }, 50);
        }

        function startAnalysis() {
            const url = document.getElementById('profile-url').value;
            if (!url) return alert('Enter a URL');
            
            document.getElementById('loader-overlay').classList.remove('hidden');
            let current = 0;
            const stepContainer = document.getElementById('steps-container');
            
            const interval = setInterval(() => {
                if (current >= steps.length) {
                    clearInterval(interval);
                    setTimeout(() => setView('dashboard'), 800);
                    return;
                }
                stepContainer.innerHTML += `
                    <div class="flex items-center gap-6 text-xl font-serif animate-in fade-in slide-in-from-bottom-2 duration-700">
                        <div class="w-1.5 h-1.5 bg-black rounded-full"></div>
                        <span>${steps[current]}</span>
                    </div>
                `;
                current++;
            }, 1000);
        }

        // --- Init ---
        window.onload = () => setView('landing');
    </script>
</body>
</html>
